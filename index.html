<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="conteudo">

    <div class="conteudo-titulo">

        <!-- 🔐 CADEADO (AGORA SIM SIMPLES E GARANTIDO) -->
        <div class="icone-cadeado">🔐</div>

        <h2 class="titulo-principal">Gerador de Senhas</h2>
        <p class="titulo-secundario">Senha segura e aleatória</p>

    </div>

    <div class="conteudo-senha">
        <input type="text" id="campo-senha" readonly>
        <button onclick="gerarSenha()">Gerar senha</button>
    </div>

    <div class="parametro">

        <h3>Personalização</h3>

        <p>Tamanho: <span id="numero-senha">12</span></p>
        <input type="range" id="tamanho" min="6" max="32" value="12">

        <br><br>

        <label><input type="checkbox" class="checkbox" checked> Maiúsculas</label><br>
        <label><input type="checkbox" class="checkbox" checked> Minúsculas</label><br>
        <label><input type="checkbox" class="checkbox" checked> Números</label><br>
        <label><input type="checkbox" class="checkbox" checked> Símbolos</label>

        <div class="forca"></div>
        <div class="entropia"></div>

    </div>

</section>

<!-- ⚠️ IMPORTANTE: main.js -->
<script src="main.js"></script>

</body>
</html>
