<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo">

        <div class="conteudo-titulo">
            <img src="cadeado.png" alt="cadeado fechado">
            <h2 class="titulo-principal">Gerador de Senhas</h2>
            <h3 class="titulo-secundario">
                Gere instantaneamente uma senha aleatória e segura.
            </h3>
        </div>

        <div class="conteudo-senha">
            <label for="campo-senha">Senha</label>
            <input type="text" id="campo-senha" readonly>
        </div>

        <div class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>

            <div class="parametro-coluna__senha">

                <div class="parametro-senha">
                    <h4>Número de caracteres</h4>
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao">+</button>
                    </div>
                </div>

                <div class="parametro-senha">
                    <h4>Características da senha</h4>

                    <div class="parametro-senha-checkbox">
                        <input id="maiusculo" name="maiusculo" type="checkbox" checked>
                        <label for="maiusculo">Letras maiúsculas</label>
                    </div>

                    <div class="parametro-senha-checkbox">
                        <input id="minusculo" name="minusculo" type="checkbox">
                        <label for="minusculo">Letras minúsculas</label>
                    </div>

                    <div class="parametro-senha-checkbox">
                        <input id="numero" name="numero" type="checkbox">
                        <label for="numero">Números</label>
                    </div>

                    <div class="parametro-senha-checkbox">
                        <input id="simbolo" name="simbolo" type="checkbox">
                        <label for="simbolo">Símbolos</label>
                    </div>
                </div>

                <div class="parametro-senha">
                    <h4>Força da senha</h4>
                    <div class="barra"></div>
                    <div class="forca fraca"></div>

                    <div class="parametro-senha-textos">
                        <p>Fraca</p>
                        <p>Média</p>
                        <p>Forte</p>
                    </div>

                    <p class="entropia"></p>
                </div>

            </div>
        </div>

    </section>

    <script src="main.js"></script>

    <footer class="footer">
        <div class="container">
            <p><strong>Gerador de Senhas</strong> • Desenvolvido para estudo</p>
            <p>Projeto para estudo de JavaScript • <span id="ano-atual"></span></p>
        </div>
    </footer>

</body>
</html>
